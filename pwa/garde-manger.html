<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garde-manger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      --bg: #f4f7f2; --bg2: #e8f0e4; --bg3: #d8e8d0;
      --text: #1a2e14; --text2: #3a5030; --text3: #7a9870;
      --accent: #4a7a38; --accent2: #fff;
      --border: #c8dcc0; --border2: #d8e8d0;
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      max-width: 700px;
      margin: 0 auto;
    }

    /* ===== MOT DE PASSE ===== */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 32px 28px;
      width: 100%;
      max-width: 320px;
    }
    .auth-titre {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
    }
    .auth-box form { display: flex; flex-direction: column; gap: 12px; }
    .auth-box input[type="password"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      font-size: 15px;
      font-family: inherit;
      width: 100%;
    }
    .auth-box input:focus { outline: none; border-color: var(--accent); }
    .auth-remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text3);
      cursor: pointer;
    }
    .auth-remember input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
    .auth-erreur { font-size: 12px; color: #c0392b; display: none; }

    /* ===== ENTÊTE ===== */
    a.retour {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--text3);
      text-decoration: none;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    a.retour:hover { color: var(--accent); }

    h1 {
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    #message {
      padding: 10px 14px;
      margin-bottom: 14px;
      display: none;
      font-size: 13px;
    }
    #message.ok { background: #e8f5e0; border: 1px solid #4a7a38; color: #4a7a38; }
    #message.err { background: #fde8e8; border: 1px solid #c0392b; color: #c0392b; }

    /* ===== ONGLETS ===== */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
    }
    .tab {
      padding: 10px 20px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--text3);
      border: none;
      background: transparent;
      font-family: inherit;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--accent); background: transparent; }
    .tab.actif { color: var(--accent); border-bottom-color: var(--accent); }

    .vue { display: none; }
    .vue.active { display: block; }

    /* ===== BOUTONS ===== */
    button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: inherit;
      transition: all 0.15s;
      white-space: nowrap;
    }
    button:hover { background: var(--accent); color: var(--accent2); }
    button.primary { background: var(--accent); color: var(--accent2); }
    button.sm {
      padding: 5px 10px;
      font-size: 11px;
      border-color: var(--border);
      color: var(--text3);
      letter-spacing: 0;
    }
    button.sm:hover { border-color: var(--accent); color: var(--accent); background: transparent; }

    /* ===== À RACHETER ===== */
    .racheter-liste { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
    .racheter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg2);
      border-left: 3px solid transparent;
    }
    .racheter-item.epuise { border-left-color: #c0392b; }
    .racheter-item.peu { border-left-color: #e07020; }
    .racheter-item-nom { font-size: 14px; flex: 1; }
    .racheter-vide { font-size: 13px; color: var(--text3); font-style: italic; padding: 8px 0; }

    /* ===== INVENTAIRE ===== */
    .ajouter-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .ajouter-row input {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      font-size: 15px;
      font-family: inherit;
    }
    .ajouter-row input:focus { outline: none; border-color: var(--accent); }
    .ajouter-row input::placeholder { color: var(--text3); font-size: 13px; }

    #recherche {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 14px;
    }
    #recherche:focus { outline: none; border-color: var(--accent); }
    #recherche::placeholder { color: var(--text3); }

    /* Catégories */
    .categorie-bloc { margin-bottom: 6px; }

    .categorie-titre {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--bg3);
      cursor: pointer;
      user-select: none;
      border-left: 3px solid var(--accent);
    }
    .categorie-titre:hover { background: var(--bg2); }
    .categorie-nom {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
    }
    .categorie-info {
      font-size: 11px;
      color: var(--text3);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .cat-alerte { color: #c0392b; font-weight: 600; }
    .categorie-toggle { font-size: 12px; color: var(--text3); }
    .categorie-items { display: flex; flex-direction: column; }
    .categorie-items.replie { display: none; }

    /* Items */
    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border2);
    }
    .item-row:hover { background: var(--bg2); }
    .item-nom { flex: 1; font-size: 14px; color: var(--text); }
    .item-row.epuise .item-nom { color: var(--text3); }
    .item-row.ignore .item-nom { color: var(--text3); font-style: italic; }

    .stock-ctrl { display: flex; align-items: center; gap: 4px; }
    .stock-btn {
      width: 26px;
      height: 26px;
      padding: 0;
      font-size: 15px;
      letter-spacing: 0;
      border-color: var(--border);
      color: var(--text3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stock-btn:hover { border-color: var(--accent); color: var(--accent); background: transparent; }

    .stock-badge {
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 5px;
      min-width: 50px;
      text-align: center;
      font-family: sans-serif;
      font-weight: 600;
      border-radius: 2px;
    }
    .badge-0 { background: #fde8e8; color: #c0392b; border: 1px solid #c0392b; }
    .badge-1 { background: #fff3e0; color: #e07020; border: 1px solid #e07020; }
    .badge-2 { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }
    .badge-3 { background: #e8f5e0; color: #4a7a38; border: 1px solid #4a7a38; }
    .badge-4 { background: #f0f0f0; color: #999; border: 1px solid #ccc; }

    .item-del {
      width: 26px;
      height: 26px;
      padding: 0;
      font-size: 13px;
      letter-spacing: 0;
      border-color: transparent;
      color: var(--text3);
    }
    .item-del:hover { border-color: #c0392b; color: #c0392b; background: transparent; }

    /* ===== COURSES ===== */
    .recettes-selector {
      display: flex;
      flex-direction: column;
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--border2);
      background: var(--bg2);
      margin-bottom: 12px;
    }
    .recette-check {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border2);
    }
    .recette-check:last-child { border-bottom: none; }
    .recette-check:hover { background: var(--bg3); }
    .recette-check input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
    .recette-check-titre { font-size: 14px; flex: 1; }
    .recette-check-cat { font-size: 10px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }

    .selector-actions { display: flex; gap: 8px; margin-bottom: 10px; }

    #liste-courses { margin-top: 16px; }

    .courses-section { margin-bottom: 12px; border: 1px solid var(--border2); }

    .courses-recette-titre {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--bg3);
      cursor: pointer;
      user-select: none;
      border-left: 3px solid var(--accent);
    }
    .courses-recette-nom {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      flex: 1;
    }
    .courses-recette-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text3);
    }
    .courses-recette-toggle { font-size: 12px; }
    .courses-recette-body { display: flex; flex-direction: column; padding: 0 10px; }
    .courses-recette-body.replie { display: none; }

    .courses-ingredient {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border2);
      font-size: 14px;
    }
    .courses-ingredient:last-child { border-bottom: none; }
    .courses-ingredient.en-stock { color: var(--text3); text-decoration: line-through; }
    .courses-ingredient.ignore-item { color: #999; font-style: italic; }
    .courses-badge {
      font-size: 9px;
      padding: 2px 5px;
      border: 1px solid currentColor;
      letter-spacing: 1px;
      text-transform: uppercase;
      flex-shrink: 0;
      font-family: sans-serif;
    }
    .en-stock .courses-badge { color: var(--text3); }
    .a-acheter .courses-badge { color: var(--accent); border-color: var(--accent); }
    .ignore-item .courses-badge { color: #999; border-color: #ccc; }
    .courses-resume {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--bg2);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text3);
    }
    .courses-resume strong { color: var(--accent); }

    .section-titre {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .section-titre.non-cliquable { cursor: default; }
    .section-count {
      font-size: 10px;
      background: var(--bg3);
      padding: 2px 7px;
      border-radius: 10px;
    }
    .section-toggle { font-size: 12px; color: var(--text3); }
    .vide { font-size: 13px; color: var(--text3); font-style: italic; padding: 8px 0; }

    .racheter-collapsible { overflow: hidden; }
    .racheter-collapsible.replie { display: none; }
  </style>
</head>
<body class="theme-naturel">

<!-- OVERLAY MOT DE PASSE -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-box">
    <div class="auth-titre">Garde-manger</div>
    <div class="auth-erreur" id="auth-erreur">Mot de passe incorrect.</div>
    <form id="auth-form" onsubmit="validerAuth(event)" autocomplete="on">
      <input type="password" id="auth-mdp" name="password"
             autocomplete="current-password" placeholder="Mot de passe" required>
      <label class="auth-remember">
        <input type="checkbox" id="auth-souvenir" checked>
        Se souvenir de moi
      </label>
      <button type="submit" class="primary">Entrer</button>
    </form>
  </div>
</div>

<!-- CONTENU PRINCIPAL (masqué jusqu'à auth) -->
<div id="contenu" style="display:none">

<a class="retour" href="index.html">← Retour aux recettes</a>
<h1>Garde-manger</h1>
<div id="message"></div>

<!-- ONGLETS -->
<div class="tabs">
  <button class="tab actif" onclick="changerOnglet('inventaire')">Inventaire</button>
  <button class="tab" onclick="changerOnglet('courses')">Courses</button>
</div>

<!-- VUE INVENTAIRE -->
<div class="vue active" id="vue-inventaire">

  <!-- À RACHETER (rétractable) -->
  <div style="margin-bottom:20px">
    <div class="section-titre" onclick="toggleRacheter()">
      À racheter
      <span style="display:flex;align-items:center;gap:8px">
        <span class="section-count" id="count-racheter">0</span>
        <span class="section-toggle" id="racheter-toggle">▾</span>
      </span>
    </div>
    <div class="racheter-collapsible" id="racheter-body">
      <div class="racheter-liste" id="liste-racheter">
        <div class="racheter-vide">Tout est en stock ✓</div>
      </div>
    </div>
  </div>

  <!-- AJOUTER + RECHERCHE -->
  <div class="ajouter-row">
    <input type="text" id="nouvel-item" placeholder="Ajouter un ingrédient…" onkeydown="if(event.key==='Enter')ajouterItem()">
    <button onclick="ajouterItem()">Ajouter</button>
  </div>
  <input type="search" id="recherche" placeholder="Rechercher…" oninput="afficherInventaire()">

  <!-- LISTE PAR CATÉGORIES -->
  <div id="liste-inventaire"></div>
</div>

<!-- VUE COURSES -->
<div class="vue" id="vue-courses">
  <div class="section-titre non-cliquable">Générer par recette</div>
  <div class="selector-actions">
    <button class="sm" onclick="toutSelectionner(true)">Tout sélectionner</button>
    <button class="sm" onclick="toutSelectionner(false)">Tout déselectionner</button>
  </div>
  <div class="recettes-selector" id="recettes-selector"></div>
  <button class="primary" onclick="genererCourses()">Générer la liste</button>
  <div id="liste-courses"></div>
</div>

</div><!-- fin #contenu -->

<script>
// ===== AUTH =====
const MDP = 'clgo';

function validerAuth(e) {
  e.preventDefault();
  const val = document.getElementById('auth-mdp').value;
  if (val !== MDP) {
    document.getElementById('auth-erreur').style.display = 'block';
    return;
  }
  if (document.getElementById('auth-souvenir').checked) {
    localStorage.setItem('gm_auth', '1');
  }
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('contenu').style.display = 'block';
  chargerDonnees();
}

if (localStorage.getItem('gm_auth') === '1') {
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('contenu').style.display = 'block';
  chargerDonnees();
}

// qte: 0=ÉPUISÉ, 1=PEU, 2=OK, 3=PLEIN, 4=IGNORÉ (pas dans courses/racheter)
const LABELS = ['ÉPUISÉ','PEU','OK','PLEIN','IGNORÉ'];
const BADGE  = ['badge-0','badge-1','badge-2','badge-3','badge-4'];

let inventaire = { items: [] };
let toutesRecettes = [];

function chargerDonnees() {
  Promise.all([
    fetch('config.json?v=' + Date.now()).then(r => r.json()),
    fetch('garde-manger.json?v=' + Date.now())
      .then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('recettes.json?v=' + Date.now()).then(r => r.json())
  ]).then(([config, gm, data]) => {
    toutesRecettes = data.recettes;
    if (!gm) {
      inventaire = JSON.parse(JSON.stringify(DEFAUT));
      sauvegarder();
    } else {
      inventaire = gm;
    }
    afficherInventaire();
    afficherRacheter();
    afficherSelectorRecettes();
  });
}

// ===== ONGLETS =====
function changerOnglet(id) {
  document.querySelectorAll('.vue').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('actif'));
  document.getElementById('vue-' + id).classList.add('active');
  event.target.classList.add('actif');
}

// ===== À RACHETER (rétractable) =====
function toggleRacheter() {
  const body = document.getElementById('racheter-body');
  const toggle = document.getElementById('racheter-toggle');
  const replie = body.classList.toggle('replie');
  toggle.textContent = replie ? '▸' : '▾';
  try { localStorage.setItem('racheter_replie', replie ? '1' : '0'); } catch(e) {}
}

// ===== INVENTAIRE =====
function getCat(nom) {
  for (const [cat, noms] of Object.entries(CAT)) {
    if (noms.some(n => normaliser(n) === normaliser(nom))) return cat;
  }
  return 'Autre';
}

function afficherInventaire() {
  const div = document.getElementById('liste-inventaire');
  const filtre = normaliser(document.getElementById('recherche')?.value || '');
  const items = inventaire.items.filter(item => !filtre || normaliser(item.nom).includes(filtre));

  if (items.length === 0) {
    div.innerHTML = '<div class="vide" style="padding:12px 0">Aucun résultat.</div>';
    return;
  }

  const groupes = {};
  items.forEach(item => {
    const cat = getCat(item.nom);
    if (!groupes[cat]) groupes[cat] = [];
    groupes[cat].push(item);
  });

  const ordre = Object.keys(CAT).concat(['Autre']);
  const cats = ordre.filter(c => groupes[c]);

  div.innerHTML = cats.map(cat => {
    const its = groupes[cat];
    // Alertes: épuisé ou peu (pas ignoré)
    const alertes = its.filter(i => i.qte <= 1).length;
    const replie = !filtre && localStorage.getItem('cat_' + cat) === '1';
    return `<div class="categorie-bloc">
      <div class="categorie-titre" onclick="toggleCat('${cat.replace(/'/g,"\\'")}')">
        <span class="categorie-nom">${cat}</span>
        <span class="categorie-info">
          ${alertes ? `<span class="cat-alerte">⚠ ${alertes}</span>` : ''}
          <span>${its.length} articles</span>
          <span class="categorie-toggle">${replie ? '▸' : '▾'}</span>
        </span>
      </div>
      <div class="categorie-items ${replie ? 'replie' : ''}">
        ${its.map(item => {
          const idx = inventaire.items.indexOf(item);
          const cls = item.qte === 0 ? 'epuise' : item.qte === 4 ? 'ignore' : '';
          return `<div class="item-row ${cls}">
            <span class="item-nom">${item.nom}</span>
            <div class="stock-ctrl">
              <button class="stock-btn" onclick="changerQte(${idx},-1)">−</button>
              <span class="stock-badge ${BADGE[item.qte]}">${LABELS[item.qte]}</span>
              <button class="stock-btn" onclick="changerQte(${idx},+1)">+</button>
            </div>
            <button class="item-del" onclick="supprimerItem(${idx})" title="Supprimer">✕</button>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleCat(cat) {
  const key = 'cat_' + cat;
  const etat = localStorage.getItem(key) === '1' ? '0' : '1';
  localStorage.setItem(key, etat);
  afficherInventaire();
}

function afficherRacheter() {
  // Ignorés (qte=4) exclus de la liste à racheter
  const aRacheter = inventaire.items
    .filter(i => i.qte <= 1)
    .sort((a, b) => a.qte - b.qte || a.nom.localeCompare(b.nom, 'fr'));
  const count = aRacheter.length;

  document.getElementById('count-racheter').textContent = count;

  const html = count === 0
    ? '<div class="racheter-vide">Tout est en stock ✓</div>'
    : aRacheter.map(item => `
      <div class="racheter-item ${item.qte===0?'epuise':'peu'}">
        <span class="racheter-item-nom">${item.nom}</span>
        <span class="stock-badge ${BADGE[item.qte]}">${LABELS[item.qte]}</span>
      </div>`).join('');

  document.getElementById('liste-racheter').innerHTML = html;

  // Restaurer état replié
  try {
    const replie = localStorage.getItem('racheter_replie') === '1';
    const body = document.getElementById('racheter-body');
    const toggle = document.getElementById('racheter-toggle');
    if (replie) { body.classList.add('replie'); toggle.textContent = '▸'; }
    else { body.classList.remove('replie'); toggle.textContent = '▾'; }
  } catch(e) {}
}

function ajouterItem() {
  const input = document.getElementById('nouvel-item');
  const nom = input.value.trim();
  if (!nom) return;
  if (inventaire.items.some(i => normaliser(i.nom) === normaliser(nom))) {
    afficherMessage('Déjà dans l\'inventaire.', 'err');
    return;
  }
  inventaire.items.push({ nom: nom.charAt(0).toLowerCase() + nom.slice(1), qte: 2 });
  inventaire.items.sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  input.value = '';
  afficherInventaire();
  afficherRacheter();
  sauvegarder();
}

function changerQte(idx, delta) {
  inventaire.items[idx].qte = Math.max(0, Math.min(4, inventaire.items[idx].qte + delta));
  afficherInventaire();
  afficherRacheter();
  sauvegarder();
}

function supprimerItem(idx) {
  inventaire.items.splice(idx, 1);
  afficherInventaire();
  afficherRacheter();
  sauvegarder();
}

let saveTimer = null;
function sauvegarder() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fetch('save_garde_manger.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(inventaire)
    }).then(r => r.json()).then(res => {
      if (!res.ok) afficherMessage('Erreur : ' + (res.erreur || ''), 'err');
    }).catch(() => afficherMessage('Erreur de connexion.', 'err'));
  }, 400);
}

// ===== COURSES =====
function afficherSelectorRecettes() {
  document.getElementById('recettes-selector').innerHTML = toutesRecettes.map(r => `
    <label class="recette-check">
      <input type="checkbox" value="${r.id}">
      <span class="recette-check-titre">${r.titre}</span>
      <span class="recette-check-cat">${r.categorie}</span>
    </label>`).join('');
}

function toutSelectionner(etat) {
  document.querySelectorAll('#recettes-selector input').forEach(cb => cb.checked = etat);
}

function normaliser(str) {
  return (str || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g,' ').trim();
}

function statutIngredient(ingredient) {
  const norm = normaliser(ingredient);
  const item = inventaire.items.find(i => norm.includes(normaliser(i.nom)));
  if (!item) return 'acheter';
  if (item.qte === 4) return 'ignore';
  if (item.qte > 0) return 'stock';
  return 'acheter';
}

function genererCourses() {
  const cochees = [...document.querySelectorAll('#recettes-selector input:checked')].map(cb => parseInt(cb.value));
  if (!cochees.length) { afficherMessage('Sélectionne au moins une recette.', 'err'); return; }
  const sel = toutesRecettes.filter(r => cochees.includes(r.id));

  let totalStock = 0, totalAcheter = 0, totalIgnore = 0;

  const html = sel.map((r, ri) => {
    let stockR = 0, acheterR = 0, ignoreR = 0;
    const lignes = r.ingredients.filter(i => !i.startsWith('—')).map(ing => {
      const statut = statutIngredient(ing);
      if (statut === 'stock') { stockR++; totalStock++; }
      else if (statut === 'ignore') { ignoreR++; totalIgnore++; }
      else { acheterR++; totalAcheter++; }
      const cls = statut === 'stock' ? 'en-stock' : statut === 'ignore' ? 'ignore-item' : 'a-acheter';
      const badge = statut === 'stock' ? '✓' : statut === 'ignore' ? '—' : '↗';
      return `<div class="courses-ingredient ${cls}">
        <span class="courses-badge">${badge}</span><span>${ing}</span></div>`;
    }).join('');

    const id = 'cr-' + ri;
    const titre = sel.length > 1 ? r.titre : '';
    return `<div class="courses-section">
      ${sel.length > 1 ? `
      <div class="courses-recette-titre" onclick="toggleRecetteCourses('${id}', this)">
        <span class="courses-recette-nom">${r.titre}</span>
        <span class="courses-recette-meta">
          ${acheterR > 0 ? `<span style="color:var(--accent);font-weight:600">↗ ${acheterR}</span>` : ''}
          <span>✓ ${stockR}</span>
          <span class="courses-recette-toggle">▾</span>
        </span>
      </div>` : ''}
      <div class="courses-recette-body" id="${id}">${lignes}</div>
    </div>`;
  }).join('');

  const resume = `<div class="courses-resume"><strong>${totalAcheter}</strong> à acheter · <span>${totalStock} en stock</span>${totalIgnore ? ` · <span style="color:#999">${totalIgnore} ignoré${totalIgnore>1?'s':''}</span>` : ''}</div>`;
  document.getElementById('liste-courses').innerHTML = html + resume;
}

function toggleRecetteCourses(id, header) {
  const body = document.getElementById(id);
  const toggle = header.querySelector('.courses-recette-toggle');
  const replie = body.classList.toggle('replie');
  toggle.textContent = replie ? '▸' : '▾';

  // Si replié, afficher seulement les manquants
  if (replie) {
    body.querySelectorAll('.courses-ingredient').forEach(el => {
      el.style.display = el.classList.contains('a-acheter') ? '' : 'none';
    });
  } else {
    body.querySelectorAll('.courses-ingredient').forEach(el => {
      el.style.display = '';
    });
  }
}

function afficherMessage(txt, type) {
  const el = document.getElementById('message');
  el.textContent = txt;
  el.className = type;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}
